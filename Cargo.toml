[package]
name = "edinet_cli"
description = "A command-line interface for EDINET."
repository = "https://github.com/strikegroup/edinet_cli"
homepage = "https://github.com/strikegroup/edinet_cli"
categories = ["command-line-utilities"]
keywords = ["EDINET", "cli", "securities", "XBRL"]
version = "0.0.3"
edition = "2024"
default-run = "edinet"
license = "Apache-2.0"
exclude = [
    ".env.example",
    ".github/",
    ".gitignore",
    "about.hbs",
    "about.toml",
    "docs/*.pdf",
    "release-plz.toml",
    "tools/",
]

[[bin]]
name = "edinet"
path = "src/main.rs"

[package.metadata.dist]
formula = "edinet"
npm-package = "edinet-cli"
include = ["THIRD_PARTY_LICENSES.html"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "strikegroup/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-npm"]
# Whether dist should create a Github Release or use an existing draft
create-release = false
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = true

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.101"
byteorder = "1.5.0"
chrono = "0.4.42"
clap = { version = "4.5.58", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
dotenvy = "0.15.7"
reqwest = "0.12.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sea-orm = { version = "1.1.17", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tabled = "0.21.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.8.23"
zip = "6.0.0"
